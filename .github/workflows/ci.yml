name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20"

jobs:
  # ─── Job 1: Lint + TypeScript ──────────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

  # ─── Job 2: Unit tests (Vitest) ───────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      # Webhook tests require the secret env var to be set for the missing-env case to work
      SUPABASE_WEBHOOK_SECRET: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── Job 3: E2E tests (Playwright) ────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      # E2E не ходят в настоящий Supabase: тесты подменяют ответы API сами.
      # Пустой адрес роняет клиент Supabase при загрузке страницы («Экран не загрузился»),
      # поэтому задаём заглушку — запросы к ней просто не проходят, данные ничьи не трогаются.
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "e2e-placeholder-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "e2e-placeholder-service-key"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # Dev-auth bypass for E2E (Telegram initData not available in CI)
      ALLOW_DEV_API_AUTH: "true"
      NEXT_PUBLIC_ALLOW_DEV_API_AUTH: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      # Снимок страницы и трейс упавшего теста (репортер в CI — github, HTML-отчёта нет).
      - name: Upload Playwright results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
